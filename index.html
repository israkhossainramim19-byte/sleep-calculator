<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lifetime Sleep Calculator</title>
<meta name="google-site-verification" content="xb0taRY5tn7-GS9EzqZXW9PZtIlgliqT---mNYbENYY" />
<style>
:root {
    --percentage: 0;
}

body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #1f2a44, #0d1117);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
}

.card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    padding: 35px;
    border-radius: 24px;
    width: 360px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.1);
    transition: 0.4s ease;
}

.card:hover {
    transform: translateY(-5px);
}

h2 {
    margin-bottom: 20px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 14px;
    margin: 12px 0;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    background: rgba(255,255,255,0.08);
    color: white;
}

input::placeholder {
    color: rgba(255,255,255,0.5);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: white;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(0,198,255,0.6);
}

.result {
    margin-top: 25px;
    opacity: 0;
    transition: opacity 0.5s ease;
}

.show {
    opacity: 1;
}

/* Premium Animated Circle */
.circle {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    margin: 20px auto;
    background: conic-gradient(
        #00c6ff calc(var(--percentage) * 1%),
        rgba(255,255,255,0.08) 0%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 0 30px rgba(0,198,255,0.4);
}

.circle::before {
    content: "";
    position: absolute;
    width: 135px;
    height: 135px;
    background: #0d1117;
    border-radius: 50%;
}

.number {
    position: relative;
    font-size: 36px;
    font-weight: bold;
}

.big-text {
    font-size: 18px;
    margin-top: 10px;
}

.sub-text {
    font-size: 14px;
    opacity: 0.7;
}
</style>
</head>

<body>

<div class="card">
    <h2>🌙 Lifetime Sleep Calculator</h2>

    <input type="number" id="age" placeholder="Your age (years)">
    <input type="number" id="sleepPerDay" placeholder="Average sleep per day (hours)">

    <button onclick="calculateSleep()">Calculate</button>

    <div class="result" id="result"></div>
</div>

<script>
function calculateSleep() {

    const age = parseFloat(document.getElementById("age").value);
    const sleepPerDay = parseFloat(document.getElementById("sleepPerDay").value);
    const resultBox = document.getElementById("result");

    if (!age || !sleepPerDay || age <= 0 || sleepPerDay <= 0) {
        resultBox.innerHTML = "Please enter valid numbers.";
        resultBox.classList.add("show");
        return;
    }

    const totalDays = age * 365.25;
    const totalHours = totalDays * sleepPerDay;
    const yearsSlept = (totalHours / 24) / 365.25;
    const percentage = (sleepPerDay / 24) * 100;

    const globalAverage = 33.3;
    const difference = percentage - globalAverage;

    let insight = "";
    let color = "#00c6ff";

    if (sleepPerDay < 7) {
        insight = "⚠️ You may not be getting enough sleep.";
        color = "#ff9800";
    } 
    else if (sleepPerDay > 9) {
        insight = "😴 You might be oversleeping.";
        color = "#ff5252";
    } 
    else {
        insight = "✅ You are within a healthy sleep range.";
        color = "#4caf50";
    }

    resultBox.innerHTML = `
        <div class="circle">
            <div class="number">0%</div>
        </div>

        <p class="big-text">You’ve slept <b>${yearsSlept.toFixed(2)} years</b> of your life.</p>

        <div style="margin:20px 0;">
            <div style="height:10px; background:rgba(255,255,255,0.1); border-radius:5px; overflow:hidden;">
                <div id="progressBar" style="width:0%; height:10px; background:${color}; transition: width 1s ease;"></div>
            </div>
            <p class="sub-text">
                🌍 Global Average: 33.3%
            </p>
            <p class="sub-text">
                ${difference > 0 
                    ? `You sleep ${difference.toFixed(1)}% more than average.`
                    : `You sleep ${Math.abs(difference).toFixed(1)}% less than average.`}
            </p>
        </div>

        <p class="sub-text" style="color:${color}; font-weight:600;">
            ${insight}
        </p>

        <button onclick="shareResult(${percentage.toFixed(1)}, ${yearsSlept.toFixed(2)})">
            Share My Result
        </button>
    `;

    resultBox.classList.add("show");

    // Animate circle + number
    let start = 0;
    let end = percentage;
    let duration = 1000;
    let increment = end / (duration / 16);

    let counter = setInterval(() => {
        start += increment;
        if (start >= end) {
            start = end;
            clearInterval(counter);
        }
        document.documentElement.style.setProperty('--percentage', start);
        document.querySelector('.number').textContent = start.toFixed(1) + "%";
    }, 16);

    // Animate progress bar
    setTimeout(() => {
        const bar = document.getElementById("progressBar");
        if (bar) {
            bar.style.width = percentage + "%";
        }
    }, 100);
}

function shareResult(percentage, years) {
    const text = `I’ve slept ${years} years of my life 😳 That’s ${percentage}% of my existence.\n\nCheck yours here: ${window.location.href}`;

    navigator.clipboard.writeText(text).then(() => {
        alert("Result copied! Paste it in Instagram 🚀");
    });
}
</script>

</body>
</html>
