<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lifetime Sleep Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --percentage: 0;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #141E30, #243B55);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .card {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #00c6ff;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background: #0072ff;
            transform: scale(1.05);
        }

        .result {
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .show {
            opacity: 1;
        }

        .circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            margin: 20px auto;
            background: conic-gradient(
                #00c6ff calc(var(--percentage) * 1%),
                rgba(255,255,255,0.15) 0%
            );
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .big-text {
            font-size: 18px;
            margin-top: 10px;
        }

        .sub-text {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>🌙 Lifetime Sleep Calculator</h2>

    <input type="number" id="age" placeholder="Your age (years)">
    <input type="number" id="sleepPerDay" placeholder="Average sleep per day (hours)">

    <button onclick="calculateSleep()">Calculate</button>

    <div class="result" id="result"></div>
</div>

<script>
function calculateSleep() {
    const age = parseFloat(document.getElementById("age").value);
    const sleepPerDay = parseFloat(document.getElementById("sleepPerDay").value);
    const resultBox = document.getElementById("result");

    if (!age || !sleepPerDay || age <= 0 || sleepPerDay <= 0) {
        resultBox.innerHTML = "Please enter valid numbers.";
        resultBox.classList.add("show");
        return;
    }

    const totalDays = age * 365.25;
    const totalHours = totalDays * sleepPerDay;
    const yearsSlept = (totalHours / 24) / 365.25;
    const percentage = (sleepPerDay / 24) * 100;

    resultBox.innerHTML = `
        <div class="circle">
            <div class="number">${percentage.toFixed(1)}%</div>
        </div>
        <p class="big-text">You’ve slept <b>${yearsSlept.toFixed(2)} years</b> of your life.</p>
        <p class="sub-text">That’s ${percentage.toFixed(1)}% of your entire existence.</p>
    `;

    document.documentElement.style.setProperty('--percentage', percentage);
    resultBox.classList.add("show");
}
</script>

</body>
</html>
